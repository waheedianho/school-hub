<div class="communication-page">
  <!-- Page Header -->
  <header class="page-header">
    <div class="header-left">
      <h1 class="page-title">Communication</h1>
      <p class="page-subtitle">
        Manage school-wide announcements, teacher notices, parent updates, and
        communication logs.
      </p>
    </div>
  </header>

  <!-- Summary KPI Cards -->
  <section class="metrics-section" aria-label="Communication Summary Metrics">
    <school-hub-communication-summary-metrics />
  </section>

  <!-- Navigation Tabs -->
  <nav class="tabs-nav" aria-label="Communication sections">
    <ul class="tabs-list" role="tablist">
      @for (tab of tabs; track tab.id) {
      <li role="presentation">
        <button
          type="button"
          role="tab"
          class="tab-btn"
          [class.active]="activeTab() === tab.id"
          [attr.aria-selected]="activeTab() === tab.id"
          (click)="setTab(tab.id)"
        >
          <span class="tab-icon">
            @if (tab.icon === 'megaphone') {
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="m3 11 18-5v12L3 14v-3z"></path>
              <path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"></path>
            </svg>
            } @else if (tab.icon === 'teacher') {
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            } @else if (tab.icon === 'parent') {
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
              <circle cx="9" cy="7" r="4"></circle>
              <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
            </svg>
            } @else if (tab.icon === 'logs') {
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
              ></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="16" y1="13" x2="8" y2="13"></line>
              <line x1="16" y1="17" x2="8" y2="17"></line>
            </svg>
            }
          </span>
          <span>{{ tab.label }}</span>
        </button>
      </li>
      }
    </ul>
  </nav>

  <!-- Main Content Layout (Table + Bottom Cards on Left, Sidebar on Right) -->
  <div class="communication-layout">
    <main class="main-column">
      <!-- Main Communication Table -->
      <section
        class="table-section"
        aria-label="Messages and Announcements Table"
      >
        <school-hub-communication-messages-table />
      </section>

      <!-- Bottom 4 Action Cards -->
      <section
        class="bottom-cards-section"
        aria-label="Communication Quick Action Cards"
      >
        <school-hub-communication-bottom-cards />
      </section>
    </main>

    <!-- Right Sidebar -->
    <aside
      class="sidebar-column"
      aria-label="Communication Summary and Attention Items"
    >
      <school-hub-communication-sidebar />
    </aside>
  </div>

  <!-- Interactive Modals -->
  <school-hub-create-announcement-modal />
  <school-hub-send-parent-message-modal />
  <school-hub-message-details-modal />
  <school-hub-schedule-blast-modal />
  <school-hub-export-communication-modal />
</div>
