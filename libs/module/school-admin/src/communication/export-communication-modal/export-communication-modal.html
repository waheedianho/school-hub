@if (isOpen()) {
<div class="modal-backdrop">
  <div
    class="modal-dialog"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modal-title-export"
  >
    <div class="modal-header">
      <div class="header-left">
        <div class="icon-bubble">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
        </div>
        <div>
          <h2 id="modal-title-export" class="modal-title">
            Export Communication Report
          </h2>
          <p class="modal-subtitle">
            Generate and download message delivery logs and engagement
            statistics
          </p>
        </div>
      </div>
      <button
        type="button"
        class="close-btn"
        (click)="onClose()"
        aria-label="Close dialog"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <div class="modal-body">
      <!-- Format Selection -->
      <div class="form-group">
        <span class="form-label">Export Format</span>
        <div class="format-options">
          <button
            type="button"
            class="format-btn"
            [class.active]="selectedFormat() === 'PDF'"
            (click)="selectedFormat.set('PDF')"
          >
            <span class="format-tag">PDF</span>
            <span class="format-name">Executive Summary</span>
          </button>
          <button
            type="button"
            class="format-btn"
            [class.active]="selectedFormat() === 'CSV'"
            (click)="selectedFormat.set('CSV')"
          >
            <span class="format-tag">CSV</span>
            <span class="format-name">Raw Data Export</span>
          </button>
          <button
            type="button"
            class="format-btn"
            [class.active]="selectedFormat() === 'Excel'"
            (click)="selectedFormat.set('Excel')"
          >
            <span class="format-tag">XLSX</span>
            <span class="format-name">Spreadsheet</span>
          </button>
        </div>
      </div>

      <!-- Date Range -->
      <div class="form-group">
        <label for="exportDateRange" class="form-label">Date Range</label>
        <select
          id="exportDateRange"
          class="form-select"
          [value]="dateRange()"
          (change)="dateRange.set($any($event.target).value)"
        >
          <option value="This Term">This Term (May 2025 - Present)</option>
          <option value="Last 30 Days">Last 30 Days</option>
          <option value="Whole Session">Full 2024/2025 Session</option>
        </select>
      </div>

      <!-- Options -->
      <div class="form-group">
        <label class="toggle-row">
          <input
            type="checkbox"
            [checked]="includeDeliveryLogs()"
            (change)="includeDeliveryLogs.set($any($event.target).checked)"
          />
          <span class="toggle-text"
            >Include recipient delivery status & failed log audit</span
          >
        </label>
      </div>
    </div>

    <div class="modal-footer">
      <button type="button" class="btn-cancel" (click)="onClose()">
        Cancel
      </button>
      <button type="button" class="btn-submit" (click)="onSubmit()">
        Export Report ({{ selectedFormat() }})
      </button>
    </div>
  </div>
</div>
}
