@if (isOpen()) {
<div class="modal-backdrop">
  <div
    class="modal-dialog"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modal-title-parent-message"
  >
    <!-- Header -->
    <div class="modal-header">
      <div class="header-left">
        <div class="icon-bubble">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
            <circle cx="9" cy="7" r="4"></circle>
            <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
          </svg>
        </div>
        <div>
          <h2 id="modal-title-parent-message" class="modal-title">
            Send Message to Parents
          </h2>
          <p class="modal-subtitle">
            Direct communication to student parents and registered guardians
          </p>
        </div>
      </div>
      <button
        type="button"
        class="close-btn"
        (click)="onClose()"
        aria-label="Close modal"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <!-- Body -->
    <div class="modal-body">
      <!-- Row: Class and Recipient Scope -->
      <div class="form-row">
        <div class="form-group">
          <label for="parentClassSelect" class="form-label">Class</label>
          <select
            id="parentClassSelect"
            class="form-select"
            [value]="formData().className"
            (change)="updateField('className', $any($event.target).value)"
          >
            @for (cls of classOptions; track cls) {
            <option [value]="cls">{{ cls }}</option>
            }
          </select>
        </div>

        <div class="form-group">
          <label for="parentAudienceSelect" class="form-label"
            >Audience Scope</label
          >
          <select
            id="parentAudienceSelect"
            class="form-select"
            [value]="formData().recipientAudience"
            (change)="updateField('recipientAudience', $any($event.target).value)"
          >
            <option value="All Parents">All Parents in Class</option>
            <option value="Selected Parents">
              Selected Parents / Specific Learners
            </option>
          </select>
        </div>
      </div>

      <!-- Row: Subject & Category -->
      <div class="form-group">
        <label for="messageSubject" class="form-label">
          Subject <span class="required">*</span>
        </label>
        <input
          id="messageSubject"
          type="text"
          class="form-input"
          placeholder="e.g. Science Fair Project Consent and Materials"
          [value]="formData().subject"
          (input)="updateField('subject', $any($event.target).value)"
        />
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="parentMsgCategory" class="form-label">Category</label>
          <select
            id="parentMsgCategory"
            class="form-select"
            [value]="formData().category"
            (change)="updateField('category', $any($event.target).value)"
          >
            <option value="Academics">Academics</option>
            <option value="Attendance">Attendance</option>
            <option value="Events">Events</option>
            <option value="General">General</option>
            <option value="Emergency">Emergency</option>
          </select>
        </div>

        <div class="form-group">
          <label for="parentMsgPriority" class="form-label">Priority</label>
          <select
            id="parentMsgPriority"
            class="form-select"
            [value]="formData().priority"
            (change)="updateField('priority', $any($event.target).value)"
          >
            <option value="Normal">Normal Priority</option>
            <option value="High">High Priority / Urgent</option>
          </select>
        </div>
      </div>

      <!-- Message Content -->
      <div class="form-group">
        <label for="messageBody" class="form-label">
          Message Body <span class="required">*</span>
        </label>
        <textarea
          id="messageBody"
          rows="5"
          class="form-textarea"
          placeholder="Write the message for parents..."
          [value]="formData().body"
          (input)="updateField('body', $any($event.target).value)"
        ></textarea>
      </div>
    </div>

    <!-- Footer -->
    <div class="modal-footer">
      <button type="button" class="btn-cancel" (click)="onClose()">
        Cancel
      </button>
      <button
        type="button"
        class="btn-submit"
        [disabled]="!formData().subject.trim() || !formData().body.trim()"
        (click)="onSubmit()"
      >
        Send Parent Message
      </button>
    </div>
  </div>
</div>
}
