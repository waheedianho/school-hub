@if (isOpen()) {
<div class="modal-backdrop">
  <div
    class="modal-dialog"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modal-title-confirm-discard"
  >
    <!-- Header -->
    <div class="modal-header">
      <div class="header-left">
        <div class="icon-bubble warning">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"
            ></path>
            <line x1="12" y1="9" x2="12" y2="13"></line>
            <line x1="12" y1="17" x2="12.01" y2="17"></line>
          </svg>
        </div>
        <div>
          <h2 id="modal-title-confirm-discard" class="modal-title">
            Discard Unsaved Changes?
          </h2>
          <p class="modal-subtitle">
            Revert all form inputs to their last saved values
          </p>
        </div>
      </div>
      <button
        type="button"
        class="close-btn"
        (click)="onClose()"
        aria-label="Close dialog"
        data-testid="close-confirm-discard-modal-btn"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <!-- Body -->
    <div class="modal-body">
      <p class="confirm-message">
        You have modified school settings that have not been saved yet. If you
        discard these changes, all unsaved edits will be permanently lost and
        reset to the previous version.
      </p>
    </div>

    <!-- Footer -->
    <div class="modal-footer">
      <button type="button" class="btn btn-outline" (click)="onClose()">
        Keep Editing
      </button>
      <button
        type="button"
        class="btn btn-danger"
        (click)="onConfirmDiscard()"
        data-testid="confirm-discard-btn"
      >
        Discard Changes
      </button>
    </div>
  </div>
</div>
}
