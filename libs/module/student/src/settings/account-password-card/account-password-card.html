<school-hub-dashboard-card
  title="Change Password"
  subtitle="Ensure your account is using a strong password"
  icon="ri-lock-password-line"
  tone="purple"
  [compact]="true"
>
  <form class="password-form" (submit)="submitForm($event)" novalidate>
    @if (statusMessage()) {
    <div class="status-alert success" role="status">
      <i class="ri-checkbox-circle-line" aria-hidden="true"></i>
      <span>{{ statusMessage() }}</span>
    </div>
    }

    <!-- Current Password -->
    <div class="form-field">
      <label for="current-password">Current Password</label>
      <div class="password-input-wrapper">
        <input
          id="current-password"
          [type]="showCurrent() ? 'text' : 'password'"
          placeholder="Enter current password"
          [value]="currentPassword()"
          (input)="currentPassword.set($any($event.target).value)"
          [attr.aria-invalid]="!!errors().current"
          aria-describedby="curr-err"
        />
        <button
          type="button"
          class="password-toggle-btn"
          (click)="showCurrent.set(!showCurrent())"
          [attr.aria-label]="showCurrent() ? 'Hide password' : 'Show password'"
        >
          <i
            [class]="showCurrent() ? 'ri-eye-off-line' : 'ri-eye-line'"
            aria-hidden="true"
          ></i>
        </button>
      </div>
      @if (errors().current) {
      <span id="curr-err" class="field-error">{{ errors().current }}</span>
      }
    </div>

    <!-- New Password -->
    <div class="form-field">
      <label for="new-password">New Password</label>
      <div class="password-input-wrapper">
        <input
          id="new-password"
          [type]="showNew() ? 'text' : 'password'"
          placeholder="Enter new password (min. 8 characters)"
          [value]="newPassword()"
          (input)="newPassword.set($any($event.target).value)"
          [attr.aria-invalid]="!!errors().newPassword"
          aria-describedby="new-err"
        />
        <button
          type="button"
          class="password-toggle-btn"
          (click)="showNew.set(!showNew())"
          [attr.aria-label]="showNew() ? 'Hide password' : 'Show password'"
        >
          <i
            [class]="showNew() ? 'ri-eye-off-line' : 'ri-eye-line'"
            aria-hidden="true"
          ></i>
        </button>
      </div>
      @if (errors().newPassword) {
      <span id="new-err" class="field-error">{{ errors().newPassword }}</span>
      }
    </div>

    <!-- Confirm Password -->
    <div class="form-field">
      <label for="confirm-password">Confirm New Password</label>
      <div class="password-input-wrapper">
        <input
          id="confirm-password"
          [type]="showConfirm() ? 'text' : 'password'"
          placeholder="Re-enter new password"
          [value]="confirmPassword()"
          (input)="confirmPassword.set($any($event.target).value)"
          [attr.aria-invalid]="!!errors().confirmPassword"
          aria-describedby="conf-err"
        />
        <button
          type="button"
          class="password-toggle-btn"
          (click)="showConfirm.set(!showConfirm())"
          [attr.aria-label]="showConfirm() ? 'Hide password' : 'Show password'"
        >
          <i
            [class]="showConfirm() ? 'ri-eye-off-line' : 'ri-eye-line'"
            aria-hidden="true"
          ></i>
        </button>
      </div>
      @if (errors().confirmPassword) {
      <span id="conf-err" class="field-error"
        >{{ errors().confirmPassword }}</span
      >
      }
    </div>

    <div class="form-action">
      <button type="submit" class="btn-primary">Update Password</button>
    </div>
  </form>
</school-hub-dashboard-card>
