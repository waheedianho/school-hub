<section
  class="quick-actions-row"
  aria-label="Assessment quick action shortcuts"
>
  <!-- 1. Create Assessment -->
  <button
    type="button"
    class="action-card"
    (click)="createAssessment.emit()"
    data-testid="action-create-assessment"
  >
    <div class="action-icon-wrap bg-blue-50 text-blue-600">
      <i class="material-symbols-outlined">add_circle</i>
    </div>
    <div class="action-details">
      <span class="action-title">Create Assessment</span>
      <span class="action-subtitle">Build pack or CBT blueprint</span>
    </div>
    <i class="material-symbols-outlined arrow-icon">chevron_right</i>
  </button>

  <!-- 2. Import Questions -->
  <button
    type="button"
    class="action-card"
    (click)="importQuestions.emit()"
    data-testid="action-import-questions"
  >
    <div class="action-icon-wrap bg-emerald-50 text-emerald-600">
      <i class="material-symbols-outlined">upload_file</i>
    </div>
    <div class="action-details">
      <span class="action-title">Import Questions</span>
      <span class="action-subtitle">Bulk upload GIFT, QTI, CSV</span>
    </div>
    <i class="material-symbols-outlined arrow-icon">chevron_right</i>
  </button>

  <!-- 3. Review Queue -->
  <button
    type="button"
    class="action-card"
    (click)="reviewQueue.emit()"
    data-testid="action-review-queue"
  >
    <div class="action-icon-wrap bg-amber-50 text-amber-600">
      <i class="material-symbols-outlined">rate_review</i>
    </div>
    <div class="action-details">
      <span class="action-title">Moderation Queue</span>
      <span class="action-subtitle"
        >{{ pendingReviewCount() }} awaiting psychometric review</span
      >
    </div>
    <i class="material-symbols-outlined arrow-icon">chevron_right</i>
  </button>

  <!-- 4. Moderation Rules -->
  <button
    type="button"
    class="action-card"
    (click)="moderationRules.emit()"
    data-testid="action-moderation-rules"
  >
    <div class="action-icon-wrap bg-purple-50 text-purple-600">
      <i class="material-symbols-outlined">verified</i>
    </div>
    <div class="action-details">
      <span class="action-title">Quality Standards</span>
      <span class="action-subtitle">Item difficulty, SLAs & rules</span>
    </div>
    <i class="material-symbols-outlined arrow-icon">chevron_right</i>
  </button>
</section>
