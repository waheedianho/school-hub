<section
  class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4"
  aria-label="Curriculum and Content Key Performance Indicators"
>
  @for (metric of metrics(); track metric.label) {
  <div
    class="bg-white rounded-xl border border-slate-200 p-4 transition-all duration-200 hover:shadow-sm flex flex-col justify-between"
    [attr.data-testid]="'metric-' + metric.label.toLowerCase().replace(' ', '-')"
  >
    <div class="flex items-start justify-between gap-2 mb-2">
      <span class="text-xs font-medium text-slate-500 leading-tight"
        >{{ metric.label }}</span
      >
      <div
        class="w-8 h-8 rounded-lg flex items-center justify-center shrink-0"
        [ngClass]="{
            'bg-blue-50 text-blue-600': metric.tone === 'primary',
            'bg-emerald-50 text-emerald-600': metric.tone === 'success',
            'bg-amber-50 text-amber-600': metric.tone === 'warning',
            'bg-purple-50 text-purple-600': metric.tone === 'purple',
            'bg-rose-50 text-rose-600': metric.tone === 'danger',
            'bg-cyan-50 text-cyan-600': metric.tone === 'info'
          }"
      >
        <span
          class="material-symbols-outlined text-lg leading-none"
          aria-hidden="true"
          >{{ metric.icon }}</span
        >
      </div>
    </div>

    <div class="space-y-1">
      <div class="text-2xl font-bold text-slate-900 tracking-tight">
        {{ metric.value }}
      </div>
      <div class="flex items-center gap-1.5 text-xs">
        <span
          class="font-medium flex items-center"
          [ngClass]="metric.trend === 'up' ? 'text-emerald-600' : 'text-rose-600'"
        >
          <span
            class="material-symbols-outlined text-sm leading-none"
            aria-hidden="true"
          >
            {{ metric.trend === 'up' ? 'arrow_upward' : 'arrow_downward' }}
          </span>
          {{ metric.change }}
        </span>
        <span class="text-slate-400">vs Apr 2025</span>
      </div>
    </div>
  </div>
  }
</section>
