<section class="metrics-grid" aria-label="Platform key performance indicators">
  @for (metric of metrics(); track metric.id) {
  <article class="metric-card">
    <div class="metric-icon-wrap" [ngClass]="getToneBg(metric.tone)">
      <i class="material-symbols-outlined">{{ metric.icon }}</i>
    </div>
    <div class="metric-content">
      <span class="metric-label">{{ metric.label }}</span>
      <h3 class="metric-value">{{ metric.value }}</h3>
      <p
        class="metric-trend"
        [class.trend-up]="metric.trend === 'up'"
        [class.trend-down]="metric.trend === 'down'"
      >
        {{ metric.changeText }}
      </p>
    </div>
  </article>
  }
</section>
