<section class="quick-actions-row" aria-label="School quick actions">
  @for (action of actions; track action.id) {
  <button type="button" class="action-card" (click)="triggerAction(action.id)">
    <div class="action-icon-wrap" [ngClass]="getToneBg(action.tone)">
      <i class="material-symbols-outlined">{{ action.icon }}</i>
    </div>
    <div class="action-details">
      <span class="action-title">{{ action.title }}</span>
      <span class="action-subtitle">{{ action.subtitle }}</span>
    </div>
    <i class="material-symbols-outlined arrow-icon">chevron_right</i>
  </button>
  }
</section>
