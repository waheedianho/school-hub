<div
  class="modal-backdrop"
  role="dialog"
  aria-modal="true"
  aria-labelledby="generate-invoice-title"
>
  <div class="modal-card">
    <div class="modal-header">
      <div class="header-titles">
        <h3 id="generate-invoice-title" class="modal-title">
          Generate Billing Invoice
        </h3>
        <p class="modal-subtitle">
          Create an official invoice for a subscribed institution.
        </p>
      </div>
      <button
        type="button"
        class="close-btn"
        (click)="onClose()"
        aria-label="Close modal"
      >
        <i class="material-symbols-outlined">close</i>
      </button>
    </div>

    <form class="modal-form" (ngSubmit)="onSubmit()">
      <!-- Select School -->
      <div class="form-field">
        <label class="field-label" for="select-school"
          >Target Institution</label
        >
        <select
          id="select-school"
          class="form-select"
          [ngModel]="selectedSchoolId()"
          (ngModelChange)="onSchoolChange($event)"
          name="schoolId"
        >
          <option value="" disabled>Select an institution...</option>
          @for (s of schools(); track s.id) {
          <option [value]="s.id">{{ s.schoolName }} ({{ s.plan }})</option>
          }
        </select>
      </div>

      <!-- Plan & Amount -->
      <div class="form-row">
        <div class="form-field flex-1">
          <label class="field-label" for="invoice-plan-select"
            >Subscription Plan</label
          >
          <select
            id="invoice-plan-select"
            class="form-select"
            [ngModel]="selectedPlan()"
            (ngModelChange)="selectedPlan.set($event)"
            name="plan"
          >
            <option value="Enterprise">Enterprise</option>
            <option value="Professional">Professional</option>
            <option value="Starter">Starter</option>
            <option value="Trial">Trial</option>
          </select>
        </div>

        <div class="form-field flex-1">
          <label class="field-label" for="invoice-amount-input"
            >Invoice Amount ($ USD)</label
          >
          <input
            id="invoice-amount-input"
            type="number"
            class="form-input"
            [ngModel]="invoiceAmount()"
            (ngModelChange)="invoiceAmount.set($event)"
            name="amount"
            min="0"
          />
        </div>
      </div>

      <!-- Due Date -->
      <div class="form-field">
        <label class="field-label" for="due-date-input">Payment Due Date</label>
        <input
          id="due-date-input"
          type="date"
          class="form-input"
          [ngModel]="dueDate()"
          (ngModelChange)="dueDate.set($event)"
          name="dueDate"
        />
      </div>

      <!-- Notice -->
      <div class="invoice-notice">
        <i class="material-symbols-outlined">info</i>
        <span
          >An automated payment reminder will be scheduled 7 days prior to the
          due date.</span
        >
      </div>

      <!-- Modal Actions -->
      <div class="modal-actions">
        <button type="button" class="btn-cancel" (click)="onClose()">
          Cancel
        </button>
        <button type="submit" class="btn-submit">
          <i class="material-symbols-outlined">receipt</i>
          <span>Generate & Send</span>
        </button>
      </div>
    </form>
  </div>
</div>
