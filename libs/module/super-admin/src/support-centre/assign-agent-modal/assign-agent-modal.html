<div
  class="modal-backdrop"
  role="dialog"
  aria-modal="true"
  aria-labelledby="assign-agent-title"
>
  <div class="modal-card">
    <div class="modal-header">
      <div class="header-left">
        <div class="header-icon-wrap">
          <span class="material-symbols-outlined">person_add</span>
        </div>
        <div>
          <h2 id="assign-agent-title" class="modal-title">
            Assign Support Agent
          </h2>
          <p class="modal-subtitle">
            Delegate ticket resolution to a qualified support specialist.
          </p>
        </div>
      </div>
      <button
        type="button"
        class="close-btn"
        (click)="closeModal.emit()"
        aria-label="Close modal"
      >
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>

    <form class="modal-body" (ngSubmit)="onSubmit()">
      <!-- Select Ticket -->
      <div class="form-group">
        <label for="assign-ticket-select" class="form-label"
          >Select Ticket *</label
        >
        <select
          id="assign-ticket-select"
          class="form-control"
          [value]="selectedTicketId()"
          (change)="selectedTicketId.set($any($event.target).value)"
        >
          @for (t of tickets(); track t.id) {
          <option [value]="t.id">
            {{ t.id }} – {{ t.school }} ({{ t.issueType }} • {{ t.priority }})
          </option>
          }
        </select>
      </div>

      <!-- Select Agent -->
      <div class="form-group">
        <label for="assign-agent-select" class="form-label"
          >Assigned Agent / Specialist *</label
        >
        <select
          id="assign-agent-select"
          class="form-control"
          [value]="selectedAgent()"
          (change)="onAgentChange($event)"
        >
          <option value="Neha Verma">Neha Verma (Support Agent)</option>
          <option value="Rohit Singh">Rohit Singh (Support Specialist)</option>
          <option value="Ankit Patel">Ankit Patel (Billing / Tech Lead)</option>
          <option value="Amit Patel">Amit Patel (Support Lead)</option>
        </select>
      </div>

      <!-- Instructions / Notes -->
      <div class="form-group">
        <label for="assign-notes-textarea" class="form-label"
          >Assignment Notes & Priority Context</label
        >
        <textarea
          id="assign-notes-textarea"
          class="form-control textarea"
          rows="3"
          placeholder="Enter triage notes or priority instructions for the assigned agent..."
          [value]="assignmentNotes()"
          (input)="assignmentNotes.set($any($event.target).value)"
        ></textarea>
      </div>

      <div class="modal-footer">
        <button
          type="button"
          class="btn btn-secondary"
          (click)="closeModal.emit()"
        >
          Cancel
        </button>
        <button type="submit" class="btn btn-primary">
          <span class="material-symbols-outlined btn-icon">check</span>
          Confirm Assignment
        </button>
      </div>
    </form>
  </div>
</div>
