<div class="metrics-grid">
  @for (metric of metrics(); track metric.id) {
  <div class="metric-card" [ngClass]="metric.colorClass">
    <div class="metric-top">
      <div class="icon-bubble">
        <span class="material-symbols-outlined">{{ metric.icon }}</span>
      </div>
      <div class="metric-content">
        <span class="metric-label">{{ metric.label }}</span>
        <div class="metric-value-row">
          <span class="metric-value">{{ metric.value }}</span>
        </div>
      </div>
    </div>
    <div class="metric-footer">
      <span
        class="trend-indicator"
        [class.trend-up]="metric.trendDirection === 'up'"
        [class.trend-down]="metric.trendDirection === 'down'"
      >
        <span class="trend-arrow">
          {{ metric.trendDirection === 'up' ? '▲' : '▼' }}
        </span>
        {{ metric.trend }}
      </span>
      <span class="metric-subtext">{{ metric.subtext }}</span>
    </div>
  </div>
  }
</div>
