<div class="metrics-grid">
  @for (metric of metrics(); track metric.id) {
  <div class="metric-card">
    <div class="metric-icon-box tone-{{ metric.tone }}">
      <span class="material-symbols-outlined">{{ metric.icon }}</span>
    </div>
    <div class="metric-info">
      <span class="metric-label">{{ metric.label }}</span>
      <div class="metric-value-row">
        <span class="metric-value">{{ metric.value }}</span>
        @if (metric.actionIcon) {
        <span class="action-badge" [attr.aria-label]="metric.subtitle">
          <span class="material-symbols-outlined action-icon"
            >{{ metric.actionIcon }}</span
          >
        </span>
        }
      </div>
      <span class="metric-subtitle">{{ metric.subtitle }}</span>
    </div>
  </div>
  }
</div>
