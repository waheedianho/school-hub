<div class="activity-card">
  <div class="card-header">
    <h3 class="card-title">Recent Score Activity</h3>
    <button type="button" class="view-all-link" (click)="viewAll.emit()">
      View all
    </button>
  </div>

  <div class="activity-list">
    @for (item of activities(); track item.id) {
    <div class="activity-item">
      <div class="activity-icon-box" [class]="getActivityTone(item.type)">
        <span class="material-symbols-outlined"
          >{{ getActivityIcon(item.type) }}</span
        >
      </div>
      <div class="activity-details">
        <span class="activity-title">{{ item.title }}</span>
        <span class="activity-timestamp">{{ item.timestamp }}</span>
      </div>
    </div>
    }
  </div>
</div>
