<school-hub-dashboard-card
  title="This Week's Lesson Timeline"
  icon="ri-calendar-event-line"
  [showIcon]="false"
  [compact]="true"
>
  <a card-action routerLink="/teacher/calendar" class="card-header-link">
    View Calendar
  </a>

  <div class="timeline-list">
    @for (item of items(); track item.id) {
    <div class="timeline-item">
      <div class="timeline-left">
        <div class="date-icon-box" aria-hidden="true">
          <i class="ri-calendar-check-line"></i>
        </div>

        <div class="time-block">
          <strong class="date-text">{{ item.dateText }}</strong>
          <span class="time-range">{{ item.timeRange }}</span>
        </div>
      </div>

      <div class="timeline-right">
        <span class="class-pill" [class]="'pill-' + item.classTone">
          {{ item.className }}
        </span>
        <span class="subject-text">{{ item.subject }}</span>
      </div>
    </div>
    }
  </div>

  <div class="timeline-footer">
    <a routerLink="/teacher/calendar" class="footer-link">
      <span>View full schedule</span>
      <i class="ri-arrow-right-s-line" aria-hidden="true"></i>
    </a>
  </div>
</school-hub-dashboard-card>
