<school-hub-dashboard-card
  title="Pack Completion Status"
  icon="ri-pie-chart-line"
  [showIcon]="false"
  [compact]="true"
>
  <div class="completion-container">
    <div class="chart-and-legend">
      <div class="chart-wrapper">
        <svg
          class="donut-chart"
          viewBox="0 0 100 100"
          aria-label="Pack completion distribution chart"
        >
          <circle
            cx="50"
            cy="50"
            [attr.r]="radius"
            fill="none"
            stroke="#f1f5f9"
            stroke-width="12"
          />

          <g transform="rotate(-90 50 50)">
            @for (slice of slices(); track slice.label) {
            <circle
              cx="50"
              cy="50"
              [attr.r]="radius"
              fill="none"
              [attr.stroke]="slice.color"
              stroke-width="12"
              [attr.stroke-dasharray]="slice.dashArray"
              [attr.stroke-dashoffset]="slice.dashOffset"
              stroke-linecap="round"
            />
            }
          </g>
        </svg>
      </div>

      <div class="legend-list">
        @for (tier of tiers(); track tier.label) {
        <div class="legend-row">
          <div class="legend-left">
            <span
              class="legend-dot"
              [style.background-color]="tier.color"
            ></span>
            <span class="legend-label">{{ tier.label }}</span>
          </div>
          <span class="legend-count"
            >{{ tier.count }} ({{ tier.percentage }}%)</span
          >
        </div>
        }
      </div>
    </div>

    <div class="total-packs-footer">
      <span class="footer-label">Total Packs</span>
      <span class="footer-count">{{ totalPacks() }}</span>
    </div>
  </div>
</school-hub-dashboard-card>
