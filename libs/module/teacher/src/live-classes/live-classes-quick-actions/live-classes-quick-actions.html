<div class="quick-actions-card">
  <div class="card-header">
    <h3 class="card-title">Quick Actions</h3>
  </div>

  <div class="actions-list">
    @for (act of actions(); track act.id) {
    <button type="button" class="action-item-btn" (click)="onSelectAction(act)">
      <div class="action-left">
        <span class="material-symbols-outlined action-icon"
          >{{ act.icon }}</span
        >
        <span class="action-label">{{ act.label }}</span>
      </div>
      <span class="material-symbols-outlined chevron-icon">chevron_right</span>
    </button>
    }
  </div>
</div>
