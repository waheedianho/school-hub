<div class="table-card">
  <div class="card-header">
    <h3 class="card-title">Recent Generated Reports</h3>
  </div>

  <div class="table-responsive">
    <table class="reports-table">
      <thead>
        <tr>
          <th scope="col">Report Name</th>
          <th scope="col">Class</th>
          <th scope="col">Subject/Scope</th>
          <th scope="col">Date Generated</th>
          <th scope="col">Generated By</th>
          <th scope="col" class="text-center">Status</th>
          <th scope="col" class="text-right">Actions</th>
        </tr>
      </thead>
      <tbody>
        @for (item of reports(); track item.id) {
        <tr class="table-row">
          <td class="report-name-col">
            <span class="report-name">{{ item.name }}</span>
          </td>
          <td class="class-col">{{ item.className }}</td>
          <td class="subject-col">{{ item.subjectScope }}</td>
          <td class="date-col">{{ item.dateGenerated }}</td>
          <td class="user-col">{{ item.generatedBy }}</td>
          <td class="text-center">
            <span class="status-pill" [class]="getStatusClass(item.status)">
              {{ item.status }}
            </span>
          </td>
          <td class="text-right">
            <div class="actions-group">
              <button
                type="button"
                class="icon-btn"
                (click)="viewReport.emit(item)"
                [attr.aria-label]="'View ' + item.name"
              >
                <span class="material-symbols-outlined">visibility</span>
              </button>
              <button
                type="button"
                class="icon-btn"
                (click)="downloadReport.emit(item)"
                [attr.aria-label]="'Download ' + item.name"
              >
                <span class="material-symbols-outlined">download</span>
              </button>
              <button
                type="button"
                class="icon-btn"
                (click)="openMenu.emit(item)"
                [attr.aria-label]="'More options for ' + item.name"
              >
                <span class="material-symbols-outlined">more_horiz</span>
              </button>
            </div>
          </td>
        </tr>
        }
      </tbody>
    </table>
  </div>

  <div class="card-footer">
    <button type="button" class="view-link-btn" (click)="viewAllReports.emit()">
      <span>View all reports</span>
      <span class="material-symbols-outlined link-icon">arrow_forward</span>
    </button>
  </div>
</div>
