<div class="chart-card">
  <div class="card-header">
    <div class="title-group">
      <h3 class="card-title">Performance Trend</h3>
      <p class="card-subtitle">Average score over time (Weekly)</p>
    </div>
    <div class="time-select-wrapper">
      <select
        class="time-select"
        [ngModel]="timeFrame()"
        (ngModelChange)="timeFrame.set($event)"
        aria-label="Select timeframe"
      >
        <option value="Weekly">Weekly</option>
        <option value="Monthly">Monthly</option>
        <option value="Term">Term</option>
      </select>
      <span class="material-symbols-outlined select-chevron">expand_more</span>
    </div>
  </div>

  <div class="chart-container">
    <svg
      viewBox="0 0 420 180"
      class="trend-svg"
      role="img"
      aria-label="Performance trend over time showing steady increase from 60 percent to 72 percent"
    >
      <defs>
        <linearGradient id="trendGradient" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3" />
          <stop offset="100%" stop-color="#6366f1" stop-opacity="0.0" />
        </linearGradient>
      </defs>

      <!-- Horizontal gridlines -->
      <line
        x1="30"
        y1="20"
        x2="400"
        y2="20"
        stroke="#f1f5f9"
        stroke-width="1"
      />
      <text x="5" y="24" class="y-label">100%</text>

      <line
        x1="30"
        y1="55"
        x2="400"
        y2="55"
        stroke="#f1f5f9"
        stroke-width="1"
      />
      <text x="12" y="59" class="y-label">75%</text>

      <line
        x1="30"
        y1="90"
        x2="400"
        y2="90"
        stroke="#f1f5f9"
        stroke-width="1"
      />
      <text x="12" y="94" class="y-label">50%</text>

      <line
        x1="30"
        y1="125"
        x2="400"
        y2="125"
        stroke="#f1f5f9"
        stroke-width="1"
      />
      <text x="12" y="129" class="y-label">25%</text>

      <line
        x1="30"
        y1="160"
        x2="400"
        y2="160"
        stroke="#f1f5f9"
        stroke-width="1"
      />
      <text x="18" y="164" class="y-label">0%</text>

      <!-- Area fill -->
      <path
        d="M 50 76 L 130 70.4 L 215 64.8 L 300 60.6 L 380 59.2 L 380 160 L 50 160 Z"
        fill="url(#trendGradient)"
      />

      <!-- Trend line -->
      <path
        d="M 50 76 L 130 70.4 L 215 64.8 L 300 60.6 L 380 59.2"
        fill="none"
        stroke="#4f46e5"
        stroke-width="2.5"
      />

      <!-- Data point circles & values -->
      <!-- Point 1: 60% -->
      <circle
        cx="50"
        cy="76"
        r="4.5"
        fill="#ffffff"
        stroke="#4f46e5"
        stroke-width="2.5"
      />
      <text x="50" y="65" text-anchor="middle" class="point-label">60%</text>
      <text x="50" y="174" text-anchor="middle" class="x-label">Apr 14–20</text>

      <!-- Point 2: 64% -->
      <circle
        cx="130"
        cy="70.4"
        r="4.5"
        fill="#ffffff"
        stroke="#4f46e5"
        stroke-width="2.5"
      />
      <text x="130" y="59.4" text-anchor="middle" class="point-label">64%</text>
      <text x="130" y="174" text-anchor="middle" class="x-label">
        Apr 21–27
      </text>

      <!-- Point 3: 68% -->
      <circle
        cx="215"
        cy="64.8"
        r="4.5"
        fill="#ffffff"
        stroke="#4f46e5"
        stroke-width="2.5"
      />
      <text x="215" y="53.8" text-anchor="middle" class="point-label">68%</text>
      <text x="215" y="174" text-anchor="middle" class="x-label">
        Apr 28–May 4
      </text>

      <!-- Point 4: 71% -->
      <circle
        cx="300"
        cy="60.6"
        r="4.5"
        fill="#ffffff"
        stroke="#4f46e5"
        stroke-width="2.5"
      />
      <text x="300" y="49.6" text-anchor="middle" class="point-label">71%</text>
      <text x="300" y="174" text-anchor="middle" class="x-label">May 5–11</text>

      <!-- Point 5: 72% -->
      <circle
        cx="380"
        cy="59.2"
        r="4.5"
        fill="#ffffff"
        stroke="#4f46e5"
        stroke-width="2.5"
      />
      <text x="380" y="48.2" text-anchor="middle" class="point-label">72%</text>
      <text x="380" y="174" text-anchor="middle" class="x-label">
        May 12–18
      </text>
    </svg>
  </div>
</div>
