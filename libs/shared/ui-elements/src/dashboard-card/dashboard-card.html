<section class="dashboard-card">
  <header class="card-heading" [class.has-subtitle]="!!subtitle()">
    @if (showIcon()) {
    <school-hub-icon-badge [icon]="icon()" [tone]="tone()" [soft]="compact()" />
    }
    <div class="heading-copy">
      <h2>{{ title() }}</h2>
      @if (subtitle()) {
      <p>{{ subtitle() }}</p>
      }
    </div>
    <ng-content select="[card-action]" />
  </header>
  <div class="card-content"><ng-content /></div>
</section>
