<dialog #dialog [attr.aria-label]="title()" (cancel)="onCancel($event)">
  <header>
    <h2>{{ title() }}</h2>
    <button type="button" aria-label="Close dialog" (click)="dismissed.emit()">
      <i class="ri-close-line" aria-hidden="true"></i>
    </button>
  </header>
  <div class="dialog-body"><ng-content /></div>
</dialog>
