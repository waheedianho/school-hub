<div class="filter-tabs" role="tablist" [attr.aria-label]="label()">
  @for (tab of tabs(); track tab.id; let index = $index) {
  <button
    #tabButton
    type="button"
    role="tab"
    [id]="panelId() + '-' + tab.id"
    [attr.aria-controls]="panelId()"
    [attr.aria-selected]="active() === tab.id"
    [tabIndex]="active() === tab.id ? 0 : -1"
    (click)="changed.emit(tab.id)"
    (keydown)="onKeydown($event, index)"
  >
    @if (tab.icon) { <i [class]="tab.icon" aria-hidden="true"></i> } {{
    tab.label }} @if (tab.count !== undefined) {
    <span class="tab-count">{{ tab.count }}</span> }
  </button>
  }
</div>
