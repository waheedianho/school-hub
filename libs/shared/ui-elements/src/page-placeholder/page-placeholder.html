<section aria-labelledby="page-title">
  <div class="mb-[25px]">
    <h1 id="page-title" class="!text-xl !mb-[8px]">{{ title() }}</h1>
    <p class="!mb-0 text-gray-500 dark:text-gray-400">{{ description() }}</p>
  </div>

  <div
    class="trezo-card bg-white dark:bg-[#0c1427] mb-[25px] rounded-md px-[20px] py-[60px] md:px-[25px] md:py-[80px] text-center"
  >
    <span
      class="inline-flex h-[72px] w-[72px] items-center justify-center rounded-full bg-primary-50 text-primary-500 dark:bg-[#15203c]"
      aria-hidden="true"
    >
      <i class="material-symbols-outlined !text-[36px]">{{ icon() }}</i>
    </span>
    <h2 class="!text-lg mt-[24px] !mb-[12px]">Coming soon</h2>
    <p class="mx-auto max-w-[420px] !mb-0 text-gray-500 dark:text-gray-400">
      This page is being prepared. Check back soon to explore more.
    </p>
  </div>
</section>
