@if (points().length) {
<div
  #chartScroll
  class="chart-scroll"
  role="region"
  aria-label="Performance chart"
  tabindex="0"
>
  <figure
    role="img"
    [attr.aria-label]="description()"
    [class.area-chart]="appearance() === 'area'"
    [style.min-width.px]="canvasWidth()"
    [style.--chart-height.px]="height()"
  >
    <div class="plot" aria-hidden="true">
      <div class="y-axis">
        @for (tick of [100, 75, 50, 25, 0]; track tick) {
        <span [style.top.px]="tickY(tick)">{{ tick }}%</span> }
      </div>
      <div class="graph">
        @if (appearance() === 'area') { @for (segment of segments(); track
        $index) {
        <div class="area-shade" [style.clip-path]="segment.polygon"></div>
        } }
        <svg [attr.viewBox]="'0 0 408 ' + height()" preserveAspectRatio="none">
          @for (tick of ticks; track tick) {
          <line
            x1="16"
            x2="392"
            [attr.y1]="tickY(tick)"
            [attr.y2]="tickY(tick)"
          />
          } @for (segment of segments(); track $index) {
          <polyline [attr.points]="segment.line" />
          }
        </svg>
        @for (point of plotted(); track $index) { @if (point.y !== undefined) {
        <span
          class="point"
          [class.latest]="$last"
          [style.left.%]="point.x / 408 * 100"
          [style.top.px]="point.y"
        ></span>
        @if (showPointValues()) {
        <strong
          class="point-value"
          [style.left.%]="point.x / 408 * 100"
          [style.top.px]="point.y - 12"
          >{{ point.value }}%</strong
        >
        } } @else if (appearance() === 'area') {
        <span
          class="no-result"
          [style.left.%]="point.x / 408 * 100"
          [style.top.px]="baseline()"
          >—</span
        >
        } }
      </div>
    </div>
    <figcaption aria-hidden="true">
      @for (point of plotted(); track $index) {
      <span
        class="week-label"
        [class.missing]="point.value === undefined"
        [style.left.%]="point.x / 408 * 100"
        [style.width.%]="100 / points().length"
        [class.first]="$first && points().length > 1 && appearance() === 'line'"
        [class.last]="$last && points().length > 1 && appearance() === 'line'"
      >
        @if (!showPointValues()) {
        <strong
          >{{ point.value === undefined ? '—' : point.value + '%' }}</strong
        >
        }{{ point.label }}
      </span>
      }
    </figcaption>
  </figure>
</div>
} @else {
<p class="empty-chart">{{ emptyMessage() }}</p>
}
