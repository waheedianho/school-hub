<ul [attr.aria-label]="label()">
  @for (item of items(); track item.id) {
  <li>
    @if (item.route) {
    <a
      [routerLink]="item.route"
      [queryParams]="item.queryParams"
      [target]="newTab() ? '_blank' : '_self'"
      [attr.rel]="newTab() ? 'noopener' : null"
      ><i [class]="item.icon" aria-hidden="true"></i
      ><span
        ><strong>{{ item.title }}</strong
        ><small
          >{{ item.meta }}{{ newTab() ? ' · Opens in a new tab' : '' }}</small
        ></span
      ><i class="ri-arrow-right-up-line" aria-hidden="true"></i
    ></a>
    } @else {
    <button type="button" (click)="downloaded.emit(item.id)">
      <i [class]="item.icon" aria-hidden="true"></i
      ><span
        ><strong>{{ item.title }}</strong><small>{{ item.meta }}</small></span
      ><i class="ri-download-line" aria-hidden="true"></i>
    </button>
    }
  </li>
  } @empty {
  <li class="empty">No resources shared yet.</li>
  }
</ul>
